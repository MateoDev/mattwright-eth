name: Deploy Blog

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build site
        run: npm run build
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          
      - name: Pin to IPFS & Update ENS
        if: github.ref == 'refs/heads/main'
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          BLOG_MANAGER_KEY: ${{ secrets.BLOG_MANAGER_KEY }}
        run: |
          # Install dependencies for IPFS upload
          npm install -g @pinata/cli
          
          # Upload to IPFS
          echo "Uploading to IPFS..."
          IPFS_HASH=$(pinata upload ./dist --name "mattwright-eth-$(date +%Y-%m-%d)" --json | jq -r '.IpfsHash')
          echo "IPFS Hash: $IPFS_HASH"
          
          # Update ENS (simplified - we'll add this step)
          echo "ENS update would happen here with hash: $IPFS_HASH"